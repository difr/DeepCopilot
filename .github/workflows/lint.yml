name: Lint & Dependency Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        # 零警告容忍模式，任何 error 均阻断 PR

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit for high/critical vulnerabilities
        # Runtime dependencies only: devDependencies never reach the bundle. The remaining
        # advisories live in the packaging toolchain (danger, @vscode/vsce) and have no fix —
        # `braces@3.0.3` is already the newest release, so auditing them would keep the job red
        # forever without protecting anything that ships.
        run: npm audit --omit=dev --audit-level=high
